name: Build MC Pack

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build mcpack
        run: |
          cd behavior_pack
          zip -r ../FreightChunkLoader.mcpack .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: FreightChunkLoader.mcpack